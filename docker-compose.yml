services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ssit_owner:ssit_2089_Inf0@database:5432/quemindicar_db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - STRIPE_MONTHLY_PRICE_ID=${STRIPE_MONTHLY_PRICE_ID}
      - STRIPE_SEMESTRAL_PRICE_ID=${STRIPE_SEMESTRAL_PRICE_ID}
      - STRIPE_ANUAL_PRICE_ID=${STRIPE_ANUAL_PRICE_ID}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL=${NEXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL}
    depends_on:
      - database
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"
    volumes:
      - application-data:/app

  database:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ssit_owner
      POSTGRES_PASSWORD: ssit_2089_Inf0
      POSTGRES_DB: quemindicar_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  application-data:

